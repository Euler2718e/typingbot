[package]
name = "typingbot"
version = "2.0.0"
description = "Native playback engine for the TypingBot terminal interface"
authors = ["Euler2718e"]
license = "MIT"
edition = "2021"

[lib]
name = "typingbot_lib"
crate-type = ["rlib"]

[dependencies]
active-win-pos-rs = "0.11"
enigo = "0.6"
rand = "0.9"
rdev = { version = "0.5", features = ["unstable_grab"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.12"

[dev-dependencies]
pretty_assertions = "1"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
