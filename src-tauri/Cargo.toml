[package]
name = "typingbot"
version = "2.0.0"
description = "Native playback engine for the TypingBot terminal interface"
authors = ["Euler2718e"]
license = "MIT"
edition = "2021"

[lib]
name = "typingbot_lib"
crate-type = ["rlib"]

[dependencies]
active-win-pos-rs = "0.11"
enigo = "0.6"
rand = "0.9"
rdev = { version = "0.5", features = ["unstable_grab"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.12"

[dev-dependencies]
pretty_assertions = "1"

# xcb 1.7.0 pins a vulnerable quick-xml build dependency. Pin the upstream
# remediation until the next xcb release includes it.
[patch.crates-io]
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
