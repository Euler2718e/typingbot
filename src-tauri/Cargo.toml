[package]
name = "typingbot"
version = "2.0.0"
description = "Local writing-process playback for desktop text fields"
authors = ["Euler2718e"]
license = "MIT"
edition = "2021"

[lib]
name = "typingbot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
active-win-pos-rs = "0.11"
enigo = "0.6"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
unicode-segmentation = "1.12"

[dev-dependencies]
pretty_assertions = "1"
