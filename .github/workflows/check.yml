name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux input dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libx11-dev libxtst-dev libxkbcommon-dev libxdo-dev
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run check:tui
      - run: bun run tui:build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build and verify terminal playback engine
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --bin typingbot-engine
      - name: Verify macOS terminal executables
        if: runner.os == 'macOS'
        run: |
          codesign --force --timestamp=none --sign - dist/typingbot
          codesign --force --timestamp=none --sign - src-tauri/target/release/typingbot-engine
          codesign --verify --strict --verbose=2 dist/typingbot
          codesign --verify --strict --verbose=2 src-tauri/target/release/typingbot-engine
          mkdir -p "$RUNNER_TEMP/package"
          cp dist/typingbot "$RUNNER_TEMP/package/typingbot"
          cp src-tauri/target/release/typingbot-engine "$RUNNER_TEMP/package/typingbot-engine"
          cp scripts/install-terminal.sh "$RUNNER_TEMP/package/install-terminal.sh"
          TYPINGBOT_INSTALL_DIR="$RUNNER_TEMP/installed/bin" \
            TYPINGBOT_PROFILE_PATH="$RUNNER_TEMP/installed/.zprofile" \
            zsh "$RUNNER_TEMP/package/install-terminal.sh" --no-open
          test -x "$RUNNER_TEMP/installed/bin/typingbot"
          test -x "$RUNNER_TEMP/installed/bin/typingbot-engine"
          "$RUNNER_TEMP/installed/bin/typingbot" --help | grep -q "terminal writing playback"
