name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build and verify macOS app bundle
        if: runner.os == 'macOS'
        run: |
          bun run tauri build --bundles app
          codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/TypingBot.app
          ./scripts/install-macos.sh src-tauri/target/release/bundle/macos/TypingBot.app \
            --destination "$RUNNER_TEMP/Applications/TypingBot.app" \
            --no-open
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/Applications/TypingBot.app"
